# CI 门禁（评审 P1-10：此前仓库完全没有 CI）。
#
# 顺序是「便宜的在前、贵的在后」：类型 → 规范 → 测试 → 数据 → 密钥 → 构建。
# 构建放在最后：`next build` 会打印各路由首屏 JS 体积，只作记录，不设通过线。
#
# CI 环境没有 .env.local：本项目在缺省环境变量下必须完整可构建
# （模型 / TTS / 向量检索只是功能降级，见 .env.example），所以这里不注入任何密钥。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Validate knowledge graph
        run: npm run kg:validate

      - name: Scan for secrets
        run: npm run check:secrets

      - name: Build
        run: npm run build

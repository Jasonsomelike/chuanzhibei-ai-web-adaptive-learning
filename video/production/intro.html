<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>自适应学习路径 · 开场动画</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#20362f;color:#f6f1df}
svg{width:100%;height:100%;display:block}
text{font-family:"Microsoft YaHei",sans-serif;fill:currentColor}
.title{font-family:"SimSun",serif;font-weight:bold;letter-spacing:2px}
.small{font-size:24px;fill:#d3ddc5}.accent{fill:#edbd78}
.ink{fill:#20362f}.muted{fill:#546958}
.act{opacity:0;transition:opacity .5s ease,transform .55s ease}
#title{opacity:1}
body[data-act="2"] #title,body[data-act="3"] #title{opacity:0;transform:translateY(-18px)}
body[data-act="2"] #route,body[data-act="3"] #features{opacity:1}
.stroke{fill:none;stroke:#b2c7aa;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.play #title .stroke{animation:trace 2.2s .2s ease forwards}
.play .token{animation:stack 1.2s both cubic-bezier(.22,.7,.3,1);animation-delay:var(--delay)}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes stack{from{opacity:0;transform:translate(72px,-72px)}to{opacity:1;transform:none}}
.point{opacity:0;transition:opacity .35s ease,transform .45s ease;transform:translateY(10px)}
.point.on{opacity:1;transform:none}
body[data-act="2"] #route .stroke{animation:trace 2.1s .1s ease both}
#features .feature{opacity:.32;transition:opacity .35s ease}
#features .feature.on{opacity:1}
.feature .symbol{stroke:#d1ddc6;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.feature.on .symbol{stroke:#edbd78}
#feature-line{transition:stroke-dashoffset .6s ease}
</style>
<body data-act="1">
<svg viewBox="0 0 1920 1080" role="img" aria-label="从学习目标、先修路径到四项学习功能">
<defs>
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.8" fill="#b8d1b8" opacity=".18"/></pattern>
  <linearGradient id="fade"><stop stop-color="white" stop-opacity="0"/><stop offset=".7" stop-color="white"/></linearGradient>
  <mask id="right"><rect width="1920" height="1080" fill="url(#fade)"/></mask>
</defs>
<rect width="1920" height="1080" fill="#20362f"/><rect width="1920" height="1080" fill="url(#grid)" mask="url(#right)"/>
<path d="M116 91 H1804" stroke="#8eaa91" stroke-width="2"/>
<text x="118" y="148" class="small">传智杯 · AI WEB 网页开发挑战赛</text>
<g id="title" class="act">
  <text x="116" y="480" class="title" font-size="116">自适应学习路径</text>
  <text x="122" y="588" font-size="40" fill="#d3ddc5">从一道诊断题，找到下一步该学什么</text>
  <path class="stroke" pathLength="1" d="M1125 630 C1230 630 1180 497 1305 497 S1410 345 1570 345"/>
  <g transform="translate(1108 624)"><g class="token" style="--delay:.2s"><circle r="17" fill="#edbd78"/></g></g>
  <g transform="translate(1305 497)"><g class="token" style="--delay:.8s"><circle r="21" fill="#20362f" stroke="#dce7ce" stroke-width="5"/></g></g>
  <g transform="translate(1570 345)"><g class="token" style="--delay:1.4s"><circle r="24" fill="#edbd78"/></g></g>
  <text x="1100" y="700" class="small">诊断起点</text><text x="1514" y="281" class="small">学习目标</text>
</g>
<g id="route" class="act">
  <text x="120" y="302" font-size="36" class="accent">本次学习目标</text>
  <text x="116" y="420" class="title" font-size="86">学会用两个栈实现队列</text>
  <path class="stroke" pathLength="1" d="M260 665 H620 C755 665 726 573 864 573 H1040 C1180 573 1140 666 1292 666 H1560"/>
  <g class="point" id="r1"><circle cx="260" cy="665" r="18" fill="#edbd78"/><text x="208" y="749" font-size="38">顺序表</text></g>
  <g class="point" id="r2"><circle cx="955" cy="573" r="18" fill="#edbd78"/><text x="863" y="512" font-size="38">栈与队列</text></g>
  <g class="point" id="r3"><circle cx="1560" cy="666" r="19" fill="#edbd78"/><text x="1434" y="749" font-size="38">双栈实现队列</text></g>
</g>
<g id="features" class="act">
  <text x="116" y="365" class="title" font-size="89">从作答到自己的学习方案</text>
  <path d="M260 660 H1620" stroke="#64816c" fill="none" stroke-width="2"/>
  <path id="feature-line" class="stroke" pathLength="1" d="M260 660 H1620" style="stroke:#edbd78"/>
  <g class="feature" id="f1" transform="translate(260 660)"><circle r="16" fill="#edbd78"/><g class="symbol" transform="translate(-36 -133)"><rect width="72" height="80" rx="9"/><path d="m16 32 9 9 20-21M15 59h42"/></g><text y="92" font-size="44" text-anchor="middle">学习诊断</text></g>
  <g class="feature" id="f2" transform="translate(712 660)"><circle r="16" fill="#edbd78"/><g class="symbol" transform="translate(-38 -125)"><circle cx="8" cy="53" r="8"/><circle cx="40" cy="15" r="8"/><circle cx="77" cy="39" r="8"/><path d="m14 47 20-25m13-3 23 16"/></g><text y="92" font-size="44" text-anchor="middle">路径规划</text></g>
  <g class="feature" id="f3" transform="translate(1168 660)"><circle r="16" fill="#edbd78"/><g class="symbol" transform="translate(-42 -132)"><path d="M8 6h70q8 0 8 9v40q0 9-10 9H38L18 80V64H9q-8 0-8-9V16q0-10 7-10Z"/><path d="M18 27h49M18 44h31"/></g><text y="92" font-size="44" text-anchor="middle">课程导师</text></g>
  <g class="feature" id="f4" transform="translate(1620 660)"><circle r="16" fill="#edbd78"/><g class="symbol" transform="translate(-38 -127)"><path d="M9 4v58m0-17c29 0 31-28 56-28"/><circle cx="9" cy="4" r="7"/><circle cx="65" cy="17" r="7"/><circle cx="9" cy="66" r="7"/></g><text y="92" font-size="44" text-anchor="middle">自定义方向</text></g>
</g>
</svg></body></html>
